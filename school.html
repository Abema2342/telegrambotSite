<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебный центр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ВИДЕО-ФОН (Медузы) -->
  <video id="bg-video" class="bg-video" autoplay loop muted playsinline>
    <source src="jellyfish-web.mp4" type="video/mp4">
  </video>
  <!-- Затемнение поверх видео, чтобы текст читался -->
  <div class="bg-video-overlay"></div>

  <!-- Видео-фон перенесено в body -->
  <video id="jellyfish-bg" src="jellyfish.mp4" muted playsinline style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;"></video>

  <!-- КАНВАС ДЛЯ САКУРЫ -->
  <canvas id="sakura-canvas"></canvas>
  <!-- ДЕРЕВО САКУРЫ (С настоящими лепестками) -->
  <svg class="sakura-tree" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градиент для лепестков (от белого к розовому) -->
      <radialGradient id="petalGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="50%" stop-color="#ffd1dc" />
        <stop offset="100%" stop-color="#ff6b8b" />
      </radialGradient>
      
      <!-- Фильтр свечения -->
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ШАБЛОН ЦВЕТКА САКУРЫ (5 лепестков + сердцевина) -->
      <g id="sakura-flower">
        <!-- 5 лепестков, повернутых друг относительно друга -->
        <path d="M 0,0 C -12,-15 -20,-25 -12,-38 C -6,-45 0,-40 0,-40 C 0,-40 6,-45 12,-38 C 20,-25 12,-15 0,0 Z" fill="url(#petalGrad)" />
        <path d="M 0,0 C -12,-15 -20,-25 -12,-38 C -6,-45 0,-40 0,-40 C 0,-40 6,-45 12,-38 C 20,-25 12,-15 0,0 Z" fill="url(#petalGrad)" transform="rotate(72)" />
        <path d="M 0,0 C -12,-15 -20,-25 -12,-38 C -6,-45 0,-40 0,-40 C 0,-40 6,-45 12,-38 C 20,-25 12,-15 0,0 Z" fill="url(#petalGrad)" transform="rotate(144)" />
        <path d="M 0,0 C -12,-15 -20,-25 -12,-38 C -6,-45 0,-40 0,-40 C 0,-40 6,-45 12,-38 C 20,-25 12,-15 0,0 Z" fill="url(#petalGrad)" transform="rotate(216)" />
        <path d="M 0,0 C -12,-15 -20,-25 -12,-38 C -6,-45 0,-40 0,-40 C 0,-40 6,-45 12,-38 C 20,-25 12,-15 0,0 Z" fill="url(#petalGrad)" transform="rotate(288)" />
        <!-- Желтая сердцевина -->
        <circle cx="0" cy="0" r="5" fill="#ffda75" />
      </g>
    </defs>

    <!-- Ветки (Ствол) -->
    <g class="branches">
      <path class="branch main" d="M -100,1200 Q 300,800 600,600 T 1100,300 T 1600,-100" />
      <path class="branch" d="M 600,600 Q 900,700 1200,550 T 1700,400" />
      <path class="branch" d="M 400,800 Q 200,600 100,400 T -100,100" />
      <path class="branch" d="M 800,450 Q 1000,250 1300,150" />
      <path class="branch thin" d="M 1200,550 Q 1400,650 1600,600 T 1900,500" />
      <path class="branch thin" d="M 1100,300 Q 1300,400 1500,300" />
      <path class="branch thin" d="M 300,700 Q 100,800 -100,900" />
      <path class="branch thin" d="M 1000,250 Q 1200,100 1400,50" />
      <path class="branch thin" d="M 800,450 Q 700,300 600,100" />
    </g>

    <!-- Цветы (Используем шаблон через <use>) -->
    <g class="blossoms" filter="url(#glow)">
      <!-- Верхушка -->
      <g transform="translate(1600, -100) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 1"/></g>
      <g transform="translate(1650, -80) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 2"/></g>
      <g transform="translate(1550, -70) scale(1)"><use href="#sakura-flower" class="flower" style="--n: 3"/></g>
      <g transform="translate(1400, 50) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 4"/></g>
      <g transform="translate(1450, 70) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 5"/></g>
      <g transform="translate(1300, 150) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 6"/></g>
      <g transform="translate(1350, 130) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 7"/></g>
      <g transform="translate(1250, 180) scale(1)"><use href="#sakura-flower" class="flower" style="--n: 8"/></g>

      <!-- Правая ветка -->
      <g transform="translate(1700, 400) scale(2)"><use href="#sakura-flower" class="flower" style="--n: 9"/></g>
      <g transform="translate(1750, 380) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 10"/></g>
      <g transform="translate(1600, 600) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 11"/></g>
      <g transform="translate(1650, 620) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 12"/></g>
      <g transform="translate(1900, 500) scale(2.25)"><use href="#sakura-flower" class="flower" style="--n: 13"/></g>
      <g transform="translate(1850, 520) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 14"/></g>
      <g transform="translate(1500, 300) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 15"/></g>
      <g transform="translate(1550, 280) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 16"/></g>

      <!-- Центральные гроздья -->
      <g transform="translate(1200, 550) scale(2.25)"><use href="#sakura-flower" class="flower" style="--n: 17"/></g>
      <g transform="translate(1250, 530) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 18"/></g>
      <g transform="translate(1150, 580) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 19"/></g>
      <g transform="translate(1100, 300) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 20"/></g>
      <g transform="translate(1150, 320) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 21"/></g>
      <g transform="translate(800, 450) scale(2)"><use href="#sakura-flower" class="flower" style="--n: 22"/></g>
      <g transform="translate(850, 430) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 23"/></g>
      <g transform="translate(750, 480) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 24"/></g>
      <g transform="translate(600, 100) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 25"/></g>
      <g transform="translate(650, 120) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 26"/></g>

      <!-- Левая ветка -->
      <g transform="translate(100, 400) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 27"/></g>
      <g transform="translate(150, 380) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 28"/></g>
      <g transform="translate(-100, 100) scale(2)"><use href="#sakura-flower" class="flower" style="--n: 29"/></g>
      <g transform="translate(-50, 120) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 30"/></g>
      <g transform="translate(300, 700) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 31"/></g>
      <g transform="translate(350, 680) scale(1)"><use href="#sakura-flower" class="flower" style="--n: 32"/></g>

      <!-- Низ -->
      <g transform="translate(-100, 900) scale(1.75)"><use href="#sakura-flower" class="flower" style="--n: 33"/></g>
      <g transform="translate(-50, 920) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 34"/></g>
      <g transform="translate(200, 900) scale(2)"><use href="#sakura-flower" class="flower" style="--n: 35"/></g>
      <g transform="translate(250, 880) scale(1.5)"><use href="#sakura-flower" class="flower" style="--n: 36"/></g>
      
      <!-- Одиночные -->
      <g transform="translate(900, 650) scale(1)"><use href="#sakura-flower" class="flower" style="--n: 37"/></g>
      <g transform="translate(1400, 450) scale(1.1)"><use href="#sakura-flower" class="flower" style="--n: 38"/></g>
      <g transform="translate(500, 300) scale(0.9)"><use href="#sakura-flower" class="flower" style="--n: 39"/></g>
      <g transform="translate(1800, 650) scale(1.25)"><use href="#sakura-flower" class="flower" style="--n: 40"/></g>
    </g>
  </svg>
  <!-- КОНТЕЙНЕР ДЛЯ TOAST-УВЕДОМЛЕНИЙ -->
  <div class="toast-container" id="toast-container"></div>
  <!-- КАНВАС ДЛЯ ЧАСТИЦ НА ФОНЕ -->
  <canvas id="bg-particles"></canvas>

  <!-- ЭКРАН 2: ОСНОВНАЯ ПАНЕЛЬ -->
  <div id="dashboard-screen">
    <header id="main-header">
      <div class="nav-container">
        <div class="nav-tabs">          
          <button class="nav-btn" data-tab="bot">Бот</button>
          <button class="nav-btn" data-tab="notes">Заметки</button>
          <button class="nav-btn" data-tab="textbooks">Учебники</button>
          <button class="nav-btn" data-tab="gdz">ГДЗ</button>
          <button class="nav-btn active" data-tab="useful">Полезное</button>
          <button class="nav-btn" data-tab="ai">Помощник</button>
          <button class="nav-btn" data-tab="valencies">Валентности</button>
          <button class="nav-btn" data-tab="calc">Калькуляторы</button>
          <button class="nav-btn" data-tab="periodic">Таблица Менделеева</button>
          <button class="nav-btn" data-tab="game">Мини-игра</button>
          <button class="nav-btn" data-tab="duels">Дуэли</button>
          <button class="nav-btn" data-tab="audit">Журнал аудита</button>
          <button class="nav-btn" data-tab="datastructure">Структура данных</button>
        </div>
        <div class="header-right">
          <button id="auth-btn" class="btn-logout">Вход</button>
          <button id="updates-btn" class="btn-updates" data-count="0" title="Обновления">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app">
      <div class="empty-state">Загрузка данных...</div>
    </main>
  </div>

  <!-- ПЛАВАЮЩАЯ КНОПКА И ПАНЕЛЬ ВЫБОРА ТЕМЫ -->
  <button class="fab-theme" id="fab-theme-btn" title="Выбрать цвет темы">
    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.58 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-4.5 9c-.83 0-1.5-.67-1.5-1.5S6.67 9 7.5 9s1.5.67 1.5 1.5S8.33 12 7.5 12zm3-4c-.83 0-1.5-.67-1.5-1.5S9.67 5 10.5 5s1.5.67 1.5 1.5S11.33 8 10.5 8zm3 0c-.83 0-1.5-.67-1.5-1.5S12.67 5 13.5 5s1.5.67 1.5 1.5S14.33 8 13.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S15.67 9 16.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
  </button>
  <div class="fab-panel" id="fab-theme-panel"></div>

  <!-- Универсальное модальное окно -->
  <div class="modal-overlay" id="common-modal">
    <div class="modal-window">
      <div class="modal-header">
        <span class="card-title" id="modal-title">Подтверждение</span>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-content"></div>
      <div class="modal-footer" id="modal-actions"></div>
    </div>
  </div>

  <!-- УНИВЕРСАЛЬНОЕ ОКНО ДЛЯ КВЕСТОВ -->
  <div class="modal-overlay" id="quest-modal">
    <div class="modal-window" style="max-width: 500px; text-align: center;">
      <div class="modal-header">
        <span class="card-title" id="quest-title">Взлом системы безопасности</span>
      </div>
      <div class="modal-body" style="padding: 24px;">
        <div id="quest-body"></div>
      </div>
    </div>
  </div>

  <!-- ОВЕРЛЕЙ ДЛЯ СКРИМЕРА / МИЛОЙ КАРТИНКИ -->
  <div id="fail-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; align-items: center; justify-content: center; background: #000; overflow: hidden;">
    <img id="fail-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- СНАЧАЛА объявляем ALLOWED_TABS -->
  <script>
    window.ALLOWED_TABS = ['useful', 'gdz', 'valencies', 'calc', 'periodic', 'notes', 'textbooks'];
  </script>
  <!-- ПОТОМ подключаем app.js -->
  <script src="app.js"></script>
</body>
</html>
