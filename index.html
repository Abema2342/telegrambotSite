<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-hover: #222222;
      --border-color: #2a2a2a;
      --accent-color: #5865F2;
      --accent-hover: #4752c4;
      --text-main: #e0e0e0;
      --text-secondary: #a0a0a0;
      --status-active: #43b581;
      --status-banned: #f04747;
      --btn-danger: #ed4245;
      --btn-danger-hover: #c03537;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* АНИМАЦИИ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(40px); }
    }

    /* TOAST-УВЕДОМЛЕНИЯ */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      min-width: 240px;
      max-width: 360px;
      pointer-events: auto;
      animation: toastIn 0.3s ease;
      word-break: break-word;
    }

    .toast.success { border-left-color: #43b581; }
    .toast.error { border-left-color: #ed4245; }
    .toast.info { border-left-color: var(--accent-color); }
    .toast.hiding { animation: toastOut 0.3s ease forwards; }

    /* ХЛЕБНЫЕ КРОШКИ */
    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .crumbs a {
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      transition: color 0.15s, background-color 0.15s;
    }

    .crumbs a:hover {
      color: var(--text-main);
      background: var(--card-hover);
    }

    .crumbs .separator { opacity: 0.4; }
    .crumbs .current { color: var(--text-main); font-weight: 500; }

    /* ПОИСКОВАЯ СТРОКА */
    .search-bar {
      position: relative;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
    }

    .search-bar::before {
      content: '🔍';
      position: absolute;
      left: 28px;
      font-size: 13px;
      opacity: 0.5;
      pointer-events: none;
    }

    .search-bar input {
      width: 100%;
      background: #111;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px 8px 36px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent-color);
    }

    .form-input {
      width: 100%;
      background: #111;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-color);
    }

    /* Навигация */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: relative;
      padding: 8px 16px;
    }

    .nav-tabs {
      grid-column: 2;
      justify-content: center;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background-color: var(--card-hover);
    }

    .nav-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(88,101,242,0.3);
    }

    .header-right {
      grid-column: 3;
      justify-self: end;
      display: flex;
      align-items: center;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-logout:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--accent-color);
    }

    .btn-updates {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      position: relative;
      padding: 0;
    }

    .btn-updates svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-updates:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--accent-color);
    }

    .btn-updates::after {
      content: attr(data-count);
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent-color);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-bg);
    }

    .btn-updates[data-count]:not([data-count="0"])::after {
      animation: softPulse 2s ease-in-out infinite;
    }

    .btn-updates[data-count="0"]::after {
      display: none;
    }

    @media (max-width: 900px) {
      .nav-container {
        display: flex;
        justify-content: space-between;
      }
      .nav-tabs {
        justify-content: flex-start;
      }
    }

    /* Основной контейнер */
    main {
      max-width: 1800px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      animation: fadeInUp 0.3s ease;
    }

    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
    }

    /* ТРЕХКОЛОНОЧНЫЙ LAYOUT */
    .layout-3col {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 240px;
      gap: 20px;
      align-items: start;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 80px;
    }

    .main-col {
      min-width: 0;
    }

    @media (max-width: 1400px) {
      .layout-3col {
        grid-template-columns: 1fr;
      }
      .side-col {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .side-col-left { order: 2; margin-top: 16px; }
      .side-col-right { order: 3; }
      .main-col { order: 1; }
    }

    @media (max-width: 700px) {
      .side-col {
        grid-template-columns: 1fr;
      }
    }

    /* ВИДЖЕТЫ */
    .card-widget {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 14px;
      display: flex;
      flex-direction: column;
      max-height: 320px;
      overflow: hidden;
      animation: fadeInUp 0.3s ease;
    }

    .card-widget-header {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .card-widget-body {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .widget-row:last-child {
      border-bottom: none;
    }

    .widget-row .label {
      color: var(--text-secondary);
    }

    .widget-row .value {
      font-weight: 500;
    }

    .widget-item-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Табличные списки */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-secondary);
      font-weight: 500;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background-color 0.15s ease;
    }

    tbody tr.clickable {
      cursor: pointer;
    }

    tbody tr.clickable:hover {
      background-color: var(--card-hover);
    }

    .col-id {
      width: 70px;
      font-family: monospace;
      color: var(--text-secondary);
    }

    .sub-text {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .truncate {
      max-width: 450px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .truncate-media {
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Кнопки общего назначения */
    .btn-primary {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(88,101,242,0.3);
      transition: all 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 10px rgba(88,101,242,0.4);
    }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-refresh:hover {
      background: var(--card-hover);
      border-color: #383838;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: var(--card-hover);
    }

    .btn-action-danger {
      color: var(--status-banned);
      border-color: rgba(240, 71, 71, 0.4);
    }

    .btn-action-danger:hover {
      background: rgba(240, 71, 71, 0.15);
      border-color: var(--status-banned);
    }

    /* Профиль пользователя */
    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
    }

    .profile-hero {
      display: flex;
      gap: 24px;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
    }

    .profile-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(0, 0, 0, 0.1);
    }

    .detail-item .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .detail-item .value {
      font-size: 14px;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-active { background: rgba(67, 181, 129, 0.15); color: var(--status-active); }
    .badge-banned { background: rgba(240, 71, 71, 0.15); color: var(--status-banned); }

    .badge-media-photo { background: rgba(88, 101, 242, 0.2); color: #5865F2; }
    .badge-media-sticker { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
    .badge-media-animation { background: rgba(230, 126, 34, 0.2); color: #e67e22; }
    .badge-media-default { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

    .badge-val-const { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
    .badge-val-var { background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.3); }
    .badge-val-inert { background: rgba(149, 165, 166, 0.15); color: #95a5a6; border: 1px solid rgba(149, 165, 166, 0.3); }

    .badge-sol-r { background: rgba(67, 181, 129, 0.15); color: #43b581; }
    .badge-sol-m { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .badge-sol-n { background: rgba(237, 66, 69, 0.15); color: #ed4245; }

    /* СЕТКА ЗАМЕТОК */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 16px;
    }

    @media (max-width: 768px) {
      .notes-grid {
        grid-template-columns: 1fr;
      }
    }

    .note-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 16px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      transition: background-color 0.15s, border-color 0.15s, transform 0.15s;
      animation: fadeInUp 0.3s ease;
    }

    .note-card:hover {
      background-color: var(--card-hover);
      border-color: #383838;
      transform: translateY(-2px);
    }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .note-card-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 24px;
    }

    .note-pin-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-color);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .note-card-preview {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .note-card-date {
      font-size: 11px;
      color: #666;
    }

    /* РЕДАКТОР ЗАМЕТКИ */
    .note-editor {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .note-input-title {
      background: #111;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 18px;
      font-weight: 700;
      padding: 12px 16px;
      outline: none;
      font-family: inherit;
    }

    .note-input-title:focus {
      border-color: var(--accent-color);
    }

    .note-input-text {
      background: #111;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      padding: 14px 16px;
      outline: none;
      font-family: inherit;
      min-height: 260px;
      resize: vertical;
      line-height: 1.6;
    }

    .note-input-text:focus {
      border-color: var(--accent-color);
    }

    .note-editor-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 8px;
    }

    .btn-danger {
      background: var(--btn-danger);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-danger:hover {
      background: var(--btn-danger-hover);
    }

    /* СТИЛИ ГДЗ */
    .gdz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
    }

    @media (max-width: 700px) {
      .gdz-grid { grid-template-columns: 1fr; }
    }

    .gdz-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .gdz-card:hover {
      background: var(--card-hover);
      border-color: #383838;
    }

    .gdz-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .gdz-card-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .nums-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      padding: 16px;
    }

    @media (max-width: 700px) {
      .nums-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .num-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .num-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent-color);
    }

    .num-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .gdz-img-wrap {
      padding: 16px;
      text-align: center;
    }

    .gdz-img-wrap img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-top: 16px;
    }

    /* ТАБЛИЦА МЕНДЕЛЕЕВА */

    /* НАСТРОЙКИ И ПУБЛИЧНЫЕ ВКЛАДКИ */
    async function loadSettings() {
      try {
        const response = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/settings.json?_=${Date.now()}`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!response.ok) {
          state.publicTabs = ['notes', 'gdz', 'useful', 'valencies', 'periodic'];
          return state.publicTabs;
        }
        const jsonMeta = await response.json();
        state.settingsSha = jsonMeta.sha;
        const rawContent = atob(jsonMeta.content.replace(/\n/g, ''));
        const utf8Content = decodeURIComponent(
          Array.prototype.map.call(rawContent, c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
          ).join('')
        );
        const data = JSON.parse(utf8Content);
        state.publicTabs = Array.isArray(data.public_tabs) ? data.public_tabs : ['notes', 'gdz', 'useful', 'valencies', 'periodic'];
        return state.publicTabs;
      } catch (err) {
        console.warn('Ошибка загрузки settings.json:', err);
        state.publicTabs = ['notes', 'gdz', 'useful', 'valencies', 'periodic'];
        return state.publicTabs;
      }
    }

    function applyAdminVisibility() {
      const publicTabs = state.publicTabs || ['notes', 'gdz', 'useful', 'valencies', 'periodic'];
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        const isPublic = publicTabs.includes(tab);
        if (isPublic) {
          btn.style.display = '';
        } else {
          btn.style.display = state.isAdmin ? '' : 'none';
        }
      });
    }

    function isTabAllowed(tab) {
      const publicTabs = state.publicTabs || ['notes', 'gdz', 'useful', 'valencies', 'periodic'];
      if (publicTabs.includes(tab)) return true;
      return state.isAdmin;
    }

    function parseMediaFromText(text) {
      if (!text || typeof text !== 'string') return null;
      const match = text.match(/^\[(photo|sticker|animation)\]\s*(.+)$/i);
      if (match) {
        return {
          media_type: match[1].toLowerCase(),
          file_name: match[2].trim()
        };
      }
      return null;
    }

    function parseChapterNumbers(numbersStr) {
      if (!numbersStr) return [];
      const str = String(numbersStr).trim();
      const rangeMatch = str.match(/^(\d+)\s*-\s*(\d+)$/);
      if (rangeMatch) {
        const start = parseInt(rangeMatch[1], 10);
        const end = parseInt(rangeMatch[2], 10);
        const res = [];
        for (let i = start; i <= end; i++) {
          res.push(i);
        }
        return res;
      }
      return str.split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => parseInt(s, 10))
        .filter(n => !isNaN(n));
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr === '—') return '—';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderSectionContentView(content) {
      const escaped = escapeHtml(content || '');
      const withFormulas = escaped.replace(/\$([^$]+)\$/g, '<span class="formula-inline">$1</span>');
      return withFormulas.split('\n').map(line => {
        if (line.trim() === '---') {
          return '<hr class="useful-divider">';
        }
        return `<p>${line}</p>`;
      }).join('');
    }

    function insertAtCursor(textarea, text) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);
      textarea.value = before + text + after;
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      textarea.focus();
      const sectionId = state.usefulEditingSectionId;

    function deleteMediaFromGitHub(fileName, messageId) {

            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          if (!getRes.ok) {

          }

          const fileMeta = await getRes.json();

          const delRes = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/media/${fileName}`, {
            method: 'DELETE',
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Delete media: ${fileName}`,
              sha: fileMeta.sha
            })
          });

          if (!delRes.ok) {
            const errData = await delRes.json();
            throw new Error(errData.message || 'Ошибка удаления медиа');
          }

          state.messages = state.messages.filter(m => m.id !== messageId);
          buildMediaCache();

          state.audit.push({
            admin_id: 0,
            admin_name: "WebAdmin",
            action: "del_media",
            target_id: messageId,
            target_name: fileName,
            time: new Date().toISOString()
          });

          render();
          showToast(`Файл ${fileName} успешно удален!`, 'success');
        } catch (err) {
          showToast(`Ошибка при удалении медиа: ${err.message}`, 'error');
        }
      });

    function buildMediaCache() {
      state.media = [];
      state.messages.forEach(msg => {

        if (parsed) {

          state.media.push({
            id: msg.id,
            user_id: msg.user_id,
            first_name: msg.first_name,
            file_name: parsed.file_name,
            media_type: parsed.media_type,
            time: msg.time,
            url: msg.url || defaultUrl
          });
        }
      });
    }

    async function loadData() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="empty-state">Загрузка данных...</div>';

      try {
        const response = await fetch(
          `${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/data.json?_=${Date.now()}`,
          { headers: { 'Accept': 'application/vnd.github.v3+json' } }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const jsonMeta = await response.json();
        const rawContent = atob(jsonMeta.content.replace(/\n/g, ''));
        const utf8Content = decodeURIComponent(
          Array.prototype.map.call(rawContent, c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
          ).join('')
        );

        const data = JSON.parse(utf8Content);

        state.last_updated = data.last_updated;
        state.users = data.users || {};
        state.messages = data.messages || [];
        state.notes = data.notes || [];
        state.admins = data.admins || [];
        state.audit = data.audit || [];
        state.dataSha = jsonMeta.sha;

        buildMediaCache();
        render();
      } catch (err) {
        app.innerHTML = `
          <div class="card">
            <div class="empty-state" style="color: var(--status-banned);">
              <p style="margin-bottom: 12px; font-size: 15px;">Ошибка загрузки данных.</p>

            </div>

      }
    }

    async function saveUpdatesToGitHub() {
      const maxRetries = 3;
      let attempt = 0;

      while (attempt < maxRetries) {
        try {
          const getRes = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/updates.json?_=${Date.now()}`, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          let sha = state.updatesSha;
          if (getRes.ok) {
            const jsonMeta = await getRes.json();
            sha = jsonMeta.sha;
            state.updatesSha = sha;
          }

          const exportData = {
            updates: state.updates
          };

          const contentBase64 = utf8ToBase64(JSON.stringify(exportData, null, 2));

          const putRes = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/updates.json`, {
            method: 'PUT',
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Update updates.json via dashboard [skip ci]`,
              content: contentBase64,
              sha: sha
            })
          });

          if (putRes.status === 409 && attempt < maxRetries - 1) {
            attempt++;
            await new Promise(r => setTimeout(r, 400));
            continue;
          }

          if (!putRes.ok) {
            const errData = await putRes.json();
            throw new Error(errData.message || 'Ошибка сохранения updates.json');
          }

          const putSuccess = await putRes.json();
          state.updatesSha = putSuccess.content.sha;
          updateBadgeCount();
          showToast("Обновления сохранены", "success");
          return;
        } catch (err) {
          if (attempt >= maxRetries - 1) {
            showToast(`Ошибка сохранения обновлений: ${err.message}`, "error");
            return;
          }
          attempt++;
          await new Promise(r => setTimeout(r, 400));
        }
      }
    }

    async function dsLoadFile(fileName) {
      state.dsSelectedFile = fileName;
      state.dsLoading = true;
      state.dsContent = 'Загрузка...';
      renderDataStructure();

      try {
        const response = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/${fileName}?_=${Date.now()}`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });

        if (response.status === 404) {
          state.dsContent = '/* Файл не найден на сервере */';
          state.dsSha = null;
          state.dsLoading = false;
          renderDataStructure();
          return;
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const jsonMeta = await response.json();
        state.dsSha = jsonMeta.sha;

        const rawContent = atob(jsonMeta.content.replace(/\n/g, ''));
        const utf8Content = decodeURIComponent(
          Array.prototype.map.call(rawContent, c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
          ).join('')
        );

        let parsed = JSON.parse(utf8Content);
        state.dsContent = JSON.stringify(parsed, null, 2);
        state.dsLoading = false;
        renderDataStructure();
      } catch (err) {
        state.dsContent = `/* Ошибка загрузки файла: ${err.message} */`;
        state.dsSha = null;
        state.dsLoading = false;
        renderDataStructure();
      }
    }

      if (!ta) return;
      const content = ta.value;

      let parsed = null;
      try {
        parsed = JSON.parse(content);
      } catch (err) {
        showToast(`Невалидный JSON: ${err.message}`, "error");
        return;
      }

      const fileName = state.dsSelectedFile;
      const contentBase64 = utf8ToBase64(JSON.stringify(parsed, null, 2));

      try {
        const putRes = await fetch(`${GITHUB_WORKER}/github/repos/${GITHUB_REPO}/contents/${fileName}`, {
          method: 'PUT',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Manual edit ${fileName} via dashboard`,
            content: contentBase64,
            sha: state.dsSha
          })
        });

        if (putRes.status === 409) {
          showToast("Конфликт SHA, обновите файл", "error");
          return;
        }

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || 'Ошибка сохранения файла');
        }

        const putSuccess = await putRes.json();
        state.dsSha = putSuccess.content.sha;
        state.dsContent = JSON.stringify(parsed, null, 2);
        showToast("Файл сохранен", "success");

        if (fileName === 'data.json') {
          await loadData();
        } else if (fileName === 'subjects.json') {
          state.gdzSubjects = null;
          await loadSubjects();
        } else if (fileName === 'useful.json') {
          state.usefulLoaded = false;
          await loadUseful();
        } else if (fileName === 'updates.json') {
          state.updatesLoaded = false;
          await loadUpdates();
        } else if (fileName === 'chemistry.json') {
          state.chemistryData = null;
          await loadChemistry();
        } else if (fileName === 'settings.json') {
          state.publicTabs = null;
          await loadSettings();
          applyAdminVisibility();
        }

        showToast(`Ошибка при сохранении: ${err.message}`, "error");
      }
    }

    function renderLeftWidgets() {
      const msgCountByUser = {};
      (state.messages || []).forEach(m => {
        const uid = String(m.user_id);
        msgCountByUser[uid] = (msgCountByUser[uid] || 0) + 1;
      });

      let topUid = null;
      let topCount = -1;
      for (const uid in msgCountByUser) {
        if (msgCountByUser[uid] > topCount) {
          topCount = msgCountByUser[uid];
          topUid = uid;
        }
      }

      let topUser = null;
      let topUserName = '—';
      let topUserNotesCount = 0;

      if (topUid) {
        topUser = state.users[topUid];
        if (topUser) {
          topUserName = topUser.first_name || 'Без имени';
        } else {
          const m = state.messages.find(x => String(x.user_id) === topUid);
          topUserName = m ? (m.first_name || 'Без имени') : 'ID ' + topUid;
        }
        topUserNotesCount = (state.notes || []).filter(n => String(n.author_id) === String(topUid)).length;
      } else {
        topCount = 0;
      }

      const topLetter = topUserName !== '—' ? (topUserName[0] || '?').toUpperCase() : '?';

      const now = new Date();
      const mskNow = new Date(now.getTime() + (3 * 3600 * 1000));
      const mskTodayStart = new Date(Date.UTC(mskNow.getUTCFullYear(), mskNow.getUTCMonth(), mskNow.getUTCDate(), 0, 0, 0));
      const todayStartEpoch = mskTodayStart.getTime() - (3 * 3600 * 1000);

      const isToday = (dateStr) => {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        return !isNaN(d.getTime()) && d.getTime() >= todayStartEpoch;
      };

      const todayMessages = (state.messages || []).filter(m => isToday(m.time)).length;
      const todayUsers = Object.values(state.users || {}).filter(u => isToday(u.first_seen)).length;
      const todayMedia = (state.media || []).filter(m => isToday(m.time)).length;
      const todayNotes = (state.notes || []).filter(n => isToday(n.created_at)).length;

      return `
        <div class="card-widget">
          <div class="card-widget-header">Топ пользователь</div>
          <div class="card-widget-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">

              ${escapeHtml(topLetter)}
            </div>
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 2px;">${escapeHtml(topUserName)}</div>
            <div style="color: var(--text-secondary); font-family: monospace; font-size: 11px; margin-bottom: 6px;">ID: ${topUid || '—'}</div>
            <div style="font-size: 12px; color: var(--text-main);">
              Сообщений: <strong>${topCount}</strong> • Заметок: <strong>${topUserNotesCount}</strong>
            </div>
          </div>
        </div>

        <div class="card-widget">
          <div class="card-widget-header">Активность сегодня</div>
          <div class="card-widget-body" style="display: flex; flex-direction: column; justify-content: center;">
            <div class="widget-row"><span class="label">Сообщений:</span><span class="value">${todayMessages}</span></div>
            <div class="widget-row"><span class="label">Новых юзеров:</span><span class="value">${todayUsers}</span></div>
            <div class="widget-row"><span class="label">Медиа:</span><span class="value">${todayMedia}</span></div>
            <div class="widget-row"><span class="label">Заметок:</span><span class="value">${todayNotes}</span></div>
          </div>
        </div>
      `;
    }

    function renderRightWidgets() {
      const last10Messages = (state.messages || []).slice(-10).reverse();
      let lastMessagesHtml = '';
      if (last10Messages.length === 0) {
        lastMessagesHtml = '<div style="color: var(--text-secondary); padding: 8px 0;">Нет сообщений</div>';
      } else {
        lastMessagesHtml = last10Messages.map(m => {
          const rawText = m.text || '';
          const preview = rawText.length > 60 ? rawText.substring(0, 60) + '...' : rawText;
          return `
            <div style="padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
              <div><strong>${escapeHtml(m.first_name || '—')}</strong>: <span style="color: var(--text-secondary);">${escapeHtml(preview)}</span></div>
              <div class="widget-item-sub">${formatDate(m.time)}</div>
            </div>
          `;
        }).join('');
      }

      const actionText = {
        'ban': 'забанил',
        'unban': 'разбанил',
        'add_admin': 'назначил админом',
        'del_admin': 'снял с админа',
        'del_media': 'удалил медиа',
        'del_user_media': 'удалил все медиа'
      };

      const last10Audit = (state.audit || []).slice(-10).reverse();
      let lastAuditHtml = '';
      if (last10Audit.length === 0) {
        lastAuditHtml = '<div style="color: var(--text-secondary); padding: 8px 0;">Записей аудита нет</div>';
      } else {
        lastAuditHtml = last10Audit.map(a => {
          const act = actionText[a.action] || a.action;
          return `
            <div style="padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
              <div><strong>${escapeHtml(a.admin_name || 'Admin')}</strong> ${act} <strong>${escapeHtml(a.target_name || 'Объект')}</strong></div>
              <div class="widget-item-sub">${formatDate(a.time)}</div>
            </div>
          `;
        }).join('');
      }

      return `
        <div class="card-widget">
          <div class="card-widget-header">Последние сообщения</div>
          <div class="card-widget-body">${lastMessagesHtml}</div>
        </div>

        <div class="card-widget">
          <div class="card-widget-header">Последние действия</div>
          <div class="card-widget-body">${lastAuditHtml}</div>
        </div>
      `;
    }

    function render() {
      const header = document.getElementById('main-header');

      // Экран обновлений
      if (state.showUpdates) {
        if (state.editingUpdateId !== null) {
          header.style.display = 'none';
          renderUpdateEditor(state.editingUpdateId);
        } else {
          header.style.display = 'none';
          renderUpdatesScreen();
        }
        return;
      }

      if (state.editingNoteId !== null) {
        header.style.display = 'none';
        renderNoteEditor(state.editingNoteId);
        return;
      } else {
        header.style.display = 'block';
      }

      if (state.selectedUserId) {
        renderUserProfile(state.selectedUserId);
        return;
      }

      switch (state.currentTab) {
        case 'users': renderUsers(); break;
        case 'messages': renderMessages(); break;
        case 'media': renderMedia(); break;
        case 'notes': renderNotes(); break;
        case 'gdz': renderGdz(); break;
        case 'useful':
          if (!state.usefulLoaded) {
            document.getElementById('app').innerHTML = '<div class="empty-state">Загрузка...</div>';
            loadUseful().then(() => renderUseful());
          } else {
            renderUseful();
          }
          break;
        case 'admins': renderAdmins(); break;
        case 'audit': renderAudit(); break;
        case 'valencies': renderValencies(); break;
        case 'periodic': renderPeriodic(); break;
        case 'datastructure': renderDataStructure(); break;
      }
    }

    /* =========================================================
       МОДАЛЬНЫЕ ОКНА
       ========================================================= */
    const modal = document.getElementById('common-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('modal-content');
    const modalActions = document.getElementById('modal-actions');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function openModal(title, content, actionsHtml) {
      modalTitle.textContent = title;
      modalContent.innerHTML = content;
      modalActions.innerHTML = actionsHtml;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    function openMessageModal(index) {
      const q = (state.searchMessages || '').toLowerCase().trim();
      let list = (state.messages || []).slice(-200).reverse();
      if (q) {
        list = list.filter(m => (m.first_name || '').toLowerCase().includes(q) || (m.text || '').toLowerCase().includes(q) || String(m.user_id).includes(q));
      }

      const msg = list[index];
      if (!msg) return;

      const parsed = parseMediaFromText(msg.text);
      const title = msg.id !== undefined ? `Сообщение #${msg.id}` : 'Сообщение';
      const body = parsed 
        ? `<strong>Тип медиа:</strong> ${getMediaBadgeHtml(parsed.media_type)}<br><br><strong>Файл:</strong> <code>${escapeHtml(parsed.file_name)}</code>`
        : `<div style="white-space: pre-wrap;">${escapeHtml(msg.text || '')}</div>`;

      const actions = `
        <span class="sub-text" style="margin-right: auto;">${escapeHtml(msg.first_name || '')} • ${formatDate(msg.time)}</span>
        <button class="btn-primary" onclick="closeModal(); openProfile('${msg.user_id}')">В профиль</button>
      `;

      openModal(title, body, actions);
    }

    // Инициализация при старте
    initThemeColor();
    checkAuth();
  </script>
</body>
</html>
