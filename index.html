<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-hover: #222222;
      --border-color: #2a2a2a;
      --accent-color: #5865F2;
      --accent-hover: #4752c4;
      --text-main: #e0e0e0;
      --text-secondary: #a0a0a0;
      --status-active: #43b581;
      --status-banned: #f04747;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Навигация */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background-color: var(--card-hover);
    }

    .nav-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    /* Основной контейнер */
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
    }

    /* Табличные списки */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-secondary);
      font-weight: 500;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background-color 0.15s ease;
    }

    tbody tr.clickable {
      cursor: pointer;
    }

    tbody tr.clickable:hover {
      background-color: var(--card-hover);
    }

    .col-id {
      width: 70px;
      font-family: monospace;
      color: var(--text-secondary);
    }

    .sub-text {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .truncate {
      max-width: 450px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .truncate-media {
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Профиль пользователя */
    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
    }

    .profile-hero {
      display: flex;
      gap: 24px;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
    }

    .profile-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(0, 0, 0, 0.1);
    }

    .detail-item .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .detail-item .value {
      font-size: 14px;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-active {
      background: rgba(67, 181, 129, 0.15);
      color: var(--status-active);
    }

    .badge-banned {
      background: rgba(240, 71, 71, 0.15);
      color: var(--status-banned);
    }

    /* Бейджи типов медиа */
    .badge-media-photo { background: rgba(88, 101, 242, 0.2); color: #5865F2; }
    .badge-media-sticker { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
    .badge-media-video { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    .badge-media-voice { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .badge-media-audio { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
    .badge-media-animation { background: rgba(230, 126, 34, 0.2); color: #e67e22; }
    .badge-media-document { background: rgba(149, 165, 166, 0.2); color: #95a5a6; }
    .badge-media-video_note { background: rgba(253, 121, 168, 0.2); color: #fd79a8; }
    .badge-media-default { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 100%;
      max-width: 550px;
      margin: 16px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal-body {
      padding: 16px;
      max-height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.6;
    }

    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.15);
    }

    .btn-link {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-link:hover {
      background: var(--accent-hover);
    }

    .audit-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-family: monospace;
      font-size: 13px;
    }

    .audit-row:hover {
      background-color: var(--card-hover);
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <header>
    <div class="nav-container">
      <button class="nav-btn active" data-tab="users">Пользователи</button>
      <button class="nav-btn" data-tab="messages">Сообщения</button>
      <button class="nav-btn" data-tab="media">Медиа</button>
      <button class="nav-btn" data-tab="admins">Админы</button>
      <button class="nav-btn" data-tab="audit">Журнал аудита</button>
    </div>
  </header>

  <!-- Контент -->
  <main id="app">
    <div class="empty-state">Загрузка данных...</div>
  </main>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="common-modal">
    <div class="modal-window">
      <div class="modal-header">
        <span class="card-title" id="modal-title">Детали</span>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-content"></div>
      <div class="modal-footer">
        <span class="sub-text" id="modal-meta"></span>
        <button class="btn-link" id="modal-user-link">В профиль</button>
      </div>
    </div>
  </div>

  <script>
    // Состояние приложения
    let state = {
      users: {},
      messages: [],
      media: [],
      admins: [],
      audit: [],
      currentTab: 'users',
      selectedUserId: null
    };

    // Конфигурация медиа-бейджей
    const mediaTypeConfig = {
      photo: { label: 'фото', emoji: '🖼', class: 'badge-media-photo' },
      sticker: { label: 'стикер', emoji: '🎨', class: 'badge-media-sticker' },
      video: { label: 'видео', emoji: '🎬', class: 'badge-media-video' },
      voice: { label: 'голос', emoji: '🎤', class: 'badge-media-voice' },
      audio: { label: 'аудио', emoji: '🎵', class: 'badge-media-audio' },
      animation: { label: 'гифка', emoji: '🎞', class: 'badge-media-animation' },
      document: { label: 'файл', emoji: '📄', class: 'badge-media-document' },
      video_note: { label: 'кружок', emoji: '⭕', class: 'badge-media-video_note' }
    };

    function getMediaBadgeHtml(type) {
      const conf = mediaTypeConfig[type] || { label: type || 'медиа', emoji: '📎', class: 'badge-media-default' };
      return `<span class="badge ${conf.class}">${conf.emoji} ${escapeHtml(conf.label)}</span>`;
    }

    // Распознавание медиа из строки формата: [тип] файл.ext
    function parseMediaFromText(text) {
      if (!text || typeof text !== 'string') return null;
      const match = text.match(/^\[(photo|sticker|video|voice|audio|animation|document|video_note)\]\s*(.+)$/i);
      if (match) {
        return {
          media_type: match[1].toLowerCase(),
          file_name: match[2].trim()
        };
      }
      return null;
    }

    // Форматирование даты
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // Загрузка и объединение данных
    async function loadData() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('Сетевая ошибка при загрузке данных');
        const data = await response.json();
        state.users = data.users || {};
        state.messages = data.messages || [];
        state.admins = data.admins || [];
        state.audit = data.audit || [];

        // Если в JSON передан готовый массив media — берем его,
        // иначе автоматически извлекаем медиафайлы из messages формата "[type] filename"
        if (Array.isArray(data.media) && data.media.length > 0) {
          state.media = data.media;
        } else {
          state.media = [];
          state.messages.forEach((msg, idx) => {
            const parsed = parseMediaFromText(msg.text);
            if (parsed) {
              state.media.push({
                id: msg.id !== undefined ? msg.id : (idx + 1),
                user_id: msg.user_id,
                first_name: msg.first_name,
                file_name: parsed.file_name,
                media_type: parsed.media_type,
                time: msg.time
              });
            }
          });
        }

        render();
      } catch (err) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="empty-state" style="color: var(--status-banned);">
              Ошибка загрузки data.json: ${err.message}.<br>
              Убедитесь, что файл существует и доступен.
            </div>
          </div>`;
      }
    }

    // Навигация
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentTab = btn.getAttribute('data-tab');
        state.selectedUserId = null;
        render();
      });
    });

    // Маршрутизатор
    function render() {
      if (state.selectedUserId) {
        renderUserProfile(state.selectedUserId);
        return;
      }

      switch (state.currentTab) {
        case 'users':
          renderUsers();
          break;
        case 'messages':
          renderMessages();
          break;
        case 'media':
          renderMedia();
          break;
        case 'admins':
          renderAdmins();
          break;
        case 'audit':
          renderAudit();
          break;
      }
    }

    // РАЗДЕЛ 1: Пользователи
    function renderUsers() {
      const userIds = Object.keys(state.users);
      const totalCount = userIds.length;

      if (totalCount === 0) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header"><span class="card-title">Пользователи</span><span class="sub-text">Всего: 0</span></div>
            <div class="empty-state">Пользователи не найдены</div>
          </div>`;
        return;
      }

      let rows = userIds.map(id => {
        const u = state.users[id];
        return `
          <tr class="clickable" onclick="openProfile('${id}')">
            <td>${escapeHtml(u.first_name || '—')}</td>
            <td><code>${id}</code></td>
            <td>${formatDate(u.last_message)}</td>
            <td>${u.requests ?? 0}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Пользователи</span>
            <span class="sub-text">Всего: ${totalCount}</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ник</th>
                  <th>ID</th>
                  <th>Последнее сообщение</th>
                  <th>Запросов</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ
    function openProfile(userId) {
      state.selectedUserId = String(userId);
      render();
    }

    function renderUserProfile(userId) {
      const user = state.users[userId];

      if (!user) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header">
              <button class="back-btn" onclick="closeProfile()">← Назад</button>
            </div>
            <div class="empty-state">Пользователь с ID ${escapeHtml(userId)} не найден в базе.</div>
          </div>
        `;
        return;
      }

      const avatarHtml = user.avatar_url 
        ? `<img src="${escapeHtml(user.avatar_url)}" alt="Avatar" class="profile-avatar">`
        : `<div class="profile-avatar">${escapeHtml((user.first_name || '?')[0].toUpperCase())}</div>`;

      // Последние 50 сообщений данного пользователя
      const userMessages = (state.messages || [])
        .filter(m => String(m.user_id) === String(userId))
        .slice(-50)
        .reverse();

      const messagesRows = userMessages.length > 0 
        ? userMessages.map(m => {
            const parsed = parseMediaFromText(m.text);
            const contentHtml = parsed 
              ? `${getMediaBadgeHtml(parsed.media_type)} <code style="margin-left: 6px;">${escapeHtml(parsed.file_name)}</code>`
              : escapeHtml(m.text || '');

            return `
              <tr>
                <td style="width: 170px;">${formatDate(m.time)}</td>
                <td>${contentHtml}</td>
              </tr>
            `;
          }).join('')
        : `<tr><td colspan="2" class="empty-state">Нет сообщений</td></tr>`;

      // Последние 20 медиафайлов данного пользователя
      const userMedia = (state.media || [])
        .filter(m => String(m.user_id) === String(userId))
        .slice(-20)
        .reverse();

      const mediaRows = userMedia.length > 0
        ? userMedia.map(m => `
            <tr>
              <td style="width: 130px;">${getMediaBadgeHtml(m.media_type)}</td>
              <td class="truncate-media" title="${escapeHtml(m.file_name || '')}"><code>${escapeHtml(m.file_name || '—')}</code></td>
              <td style="width: 170px;">${formatDate(m.time)}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="3" class="empty-state">Нет медиафайлов</td></tr>`;

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <button class="back-btn" onclick="closeProfile()">← Назад</button>
            <span class="sub-text">Профиль пользователя</span>
          </div>
          
          <div class="profile-hero">
            ${avatarHtml}
            <div>
              <div style="font-size: 20px; font-weight: 700;">${escapeHtml(user.first_name || 'Без имени')}</div>
              <div class="sub-text">@${escapeHtml(user.username || '—')}</div>
            </div>
          </div>

          <div class="profile-details-grid">
            <div class="detail-item">
              <div class="label">ID</div>
              <div class="value"><code>${userId}</code></div>
            </div>
            <div class="detail-item">
              <div class="label">Статус</div>
              <div class="value">
                ${user.banned 
                  ? '<span class="badge badge-banned">Забанен</span>' 
                  : '<span class="badge badge-active">Активен</span>'}
              </div>
            </div>
            <div class="detail-item">
              <div class="label">Запросов</div>
              <div class="value">${user.requests ?? 0}</div>
            </div>
            <div class="detail-item">
              <div class="label">Первый вход</div>
              <div class="value">${formatDate(user.first_seen)}</div>
            </div>
            <div class="detail-item">
              <div class="label">Посл. сообщение</div>
              <div class="value">${formatDate(user.last_message)}</div>
            </div>
          </div>

          <div class="card-header">
            <span class="card-title">Медиафайлы (до 20)</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Тип</th>
                  <th>Файл</th>
                  <th>Время</th>
                </tr>
              </thead>
              <tbody>${mediaRows}</tbody>
            </table>
          </div>

          <div class="card-header" style="border-top: 1px solid var(--border-color);">
            <span class="card-title">Последние сообщения (до 50)</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Время</th>
                  <th>Текст</th>
                </tr>
              </thead>
              <tbody>${messagesRows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function closeProfile() {
      state.selectedUserId = null;
      render();
    }

    // РАЗДЕЛ 2: Сообщения
    function renderMessages() {
      const totalCount = (state.messages || []).length;
      const list = (state.messages || []).slice(-200).reverse();

      if (totalCount === 0) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header"><span class="card-title">Сообщения</span><span class="sub-text">Всего: 0</span></div>
            <div class="empty-state">Сообщений нет</div>
          </div>`;
        return;
      }

      let rows = list.map((m, index) => {
        const text = m.text || '';
        const parsed = parseMediaFromText(text);

        let cellContent;
        if (parsed) {
          cellContent = `${getMediaBadgeHtml(parsed.media_type)} <code style="margin-left: 6px;">${escapeHtml(parsed.file_name)}</code>`;
        } else {
          const preview = text.length > 100 ? text.substring(0, 100) + '...' : text;
          cellContent = escapeHtml(preview);
        }

        const msgId = m.id !== undefined ? `#${m.id}` : '—';
        return `
          <tr class="clickable" onclick="openMessageModal(${index})">
            <td class="col-id">${msgId}</td>
            <td>${escapeHtml(m.first_name || '—')}</td>
            <td><code>${m.user_id}</code></td>
            <td class="truncate">${cellContent}</td>
            <td>${formatDate(m.time)}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Сообщения</span>
            <span class="sub-text">Всего: ${totalCount}</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Ник</th>
                  <th>User ID</th>
                  <th>Текст</th>
                  <th>Время</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // РАЗДЕЛ 3: Медиа
    function renderMedia() {
      const mediaList = state.media || [];
      const totalCount = mediaList.length;

      if (totalCount === 0) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header"><span class="card-title">Медиа</span><span class="sub-text">Всего: 0</span></div>
            <div class="empty-state">Нет данных</div>
          </div>`;
        return;
      }

      const list = mediaList.slice().reverse();

      let rows = list.map((m, index) => {
        const fullFileName = m.file_name || '';
        const previewFile = fullFileName.length > 40 ? fullFileName.substring(0, 40) + '...' : fullFileName;
        const mediaId = m.id !== undefined ? `#${m.id}` : '—';

        return `
          <tr class="clickable" onclick="openMediaModal(${index})">
            <td class="col-id">${mediaId}</td>
            <td>${getMediaBadgeHtml(m.media_type)}</td>
            <td>${escapeHtml(m.first_name || '—')}</td>
            <td><code>${m.user_id}</code></td>
            <td class="truncate-media" title="${escapeHtml(fullFileName)}"><code>${escapeHtml(previewFile || '—')}</code></td>
            <td>${formatDate(m.time)}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Медиа</span>
            <span class="sub-text">Всего: ${totalCount}</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Тип</th>
                  <th>Отправитель</th>
                  <th>User ID</th>
                  <th>Файл</th>
                  <th>Время</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // РАЗДЕЛ 4: Админы
    function renderAdmins() {
      const adminList = state.admins || [];
      const totalCount = adminList.length;

      if (totalCount === 0) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header"><span class="card-title">Админы</span><span class="sub-text">Всего: 0</span></div>
            <div class="empty-state">Список админов пуст</div>
          </div>`;
        return;
      }

      let rows = adminList.map(admin => {
        const user = state.users[String(admin.id)];
        const name = user ? user.first_name : '—';
        const isClickable = !!user;

        return `
          <tr class="${isClickable ? 'clickable' : ''}" ${isClickable ? `onclick="openProfile('${admin.id}')"` : ''}>
            <td>${escapeHtml(name)}</td>
            <td><code>${admin.id}</code></td>
            <td>${formatDate(admin.appointed_at)}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Админы</span>
            <span class="sub-text">Всего: ${totalCount}</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ник</th>
                  <th>ID</th>
                  <th>Назначен</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // РАЗДЕЛ 5: Журнал аудита
    function renderAudit() {
      const auditList = state.audit || [];

      if (auditList.length === 0) {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="card-header"><span class="card-title">Журнал аудита</span><span class="sub-text">Всего: 0</span></div>
            <div class="empty-state">Записей аудита нет</div>
          </div>`;
        return;
      }

      const actionText = {
        'ban': 'забанил',
        'unban': 'разбанил',
        'add_admin': 'назначил админом',
        'del_admin': 'снял с поста админа',
        'del_media': 'удалил медиа',
        'del_user_media': 'удалил все медиа'
      };

      const rows = auditList.slice().reverse().map(item => {
        const actionStr = actionText[item.action] || item.action;
        const timeStr = formatDate(item.time);
        return `
          <div class="audit-row">
            <span style="color: var(--text-secondary);">[${timeStr}]</span> 
            <strong>${escapeHtml(item.admin_name || 'Admin')}</strong> 
            <span>${actionStr}</span> 
            <strong>${escapeHtml(item.target_name || 'Объект')}</strong> 
            <span class="sub-text">(ID: ${item.target_id})</span>
          </div>
        `;
      }).join('');

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Журнал аудита</span>
            <span class="sub-text">Всего: ${auditList.length}</span>
          </div>
          ${rows}
        </div>
      `;
    }

    // Модальное окно
    const modal = document.getElementById('common-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalContent = document.getElementById('modal-content');
    const modalMeta = document.getElementById('modal-meta');
    const modalUserLink = document.getElementById('modal-user-link');

    function openMessageModal(index) {
      const list = (state.messages || []).slice(-200).reverse();
      const msg = list[index];
      if (!msg) return;

      const parsed = parseMediaFromText(msg.text);

      modalTitle.textContent = msg.id !== undefined ? `Сообщение #${msg.id}` : 'Сообщение';
      
      if (parsed) {
        modalContent.innerHTML = `<strong>Тип медиа:</strong> ${getMediaBadgeHtml(parsed.media_type)}\n\n<strong>Имя файла:</strong>\n<code>${escapeHtml(parsed.file_name)}</code>`;
      } else {
        modalContent.textContent = msg.text || '';
      }

      modalMeta.textContent = `${msg.first_name || '—'} (ID: ${msg.user_id}) • ${formatDate(msg.time)}`;
      
      modalUserLink.onclick = () => {
        closeModal();
        openProfile(msg.user_id);
      };

      modal.classList.add('active');
    }

    function openMediaModal(index) {
      const list = (state.media || []).slice().reverse();
      const item = list[index];
      if (!item) return;

      modalTitle.textContent = item.id !== undefined ? `Медиафайл #${item.id}` : 'Медиафайл';
      modalContent.innerHTML = `<strong>Полное имя файла:</strong>\n<code>${escapeHtml(item.file_name || '—')}</code>\n\n<strong>Тип:</strong> ${getMediaBadgeHtml(item.media_type)}`;
      modalMeta.textContent = `${item.first_name || '—'} (ID: ${item.user_id}) • ${formatDate(item.time)}`;

      modalUserLink.onclick = () => {
        closeModal();
        openProfile(item.user_id);
      };

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadData();
  </script>
</body>
</html>
